name: Keep Streamlit Awake

on:
  schedule:
    # Runs at minute 0 past every 11th hour (e.g., 00:00, 11:00, 22:00 UTC)
    - cron: "0 */11 * * *"
  workflow_dispatch: # Enables a manual trigger button in the GitHub UI

permissions:
  contents: write # Grants the GITHUB_TOKEN permission to push commits

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push Empty Commit
        run: |
          git commit --allow-empty -m "chore: keep streamlit awake [skip ci]"
          git push
